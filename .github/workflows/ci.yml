name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check engine/scripts
      - name: Byte-compile
        run: python -m py_compile engine/scripts/*.py
      - name: Validate JSON specs
        run: |
          python - <<'PY'
          import json, glob
          for f in glob.glob("spec/*.json") + glob.glob("projects/*/config.json"):
              json.load(open(f)); print("ok", f)
          PY
